name: HardwareBenchmark
version: '${project.version}'
main: com.hwbench.HardwareBenchmarkPlugin
# Universal JAR：不声明 api-version，使插件在 Bukkit/Spigot/Paper 1.7.10~1.21.3 上以"legacy API"模式加载
# （api-version 是 1.13+ 引入的可选字段，缺失时 Bukkit 回退到兼容模式，对所有版本都安全）
author: HWBench
description: "因租用的面板服一直卡顿、被卡得不耐烦，我用 AI 编写的硬件检测与跑分插件：甜甜圈渲染跑分、内存/磁盘测试、Linux 库自动补全"
website: https://github.com/waiyi233ye/HardwareBenchmark

commands:
  hwbench:
    description: 硬件检测与跑分主命令
    usage: |
      /hwbench - 查看帮助
      /hwbench detect - 检测硬件信息
      /hwbench cpu - CPU甜甜圈跑分
      /hwbench mem - 内存读写跑分
      /hwbench disk - 磁盘IO跑分
      /hwbench all - 运行全部跑分
      /hwbench libs - 检查并补全Linux运行库
      /hwbench lock - 手动锁定服务器（踢出玩家）
      /hwbench unlock - 手动解锁服务器
    aliases: [hw, benchmark]
    permission: hwbench.use

permissions:
  hwbench.use:
    description: 允许使用硬件跑分插件
    default: op
  hwbench.admin:
    description: 允许管理硬件跑分插件
    default: op
