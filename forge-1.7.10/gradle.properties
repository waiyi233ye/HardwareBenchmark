org.gradle.jvmargs=-Xmx2g -Djava.net.preferIPv4Stack=true
org.gradle.daemon=false
org.gradle.parallel=false

# ForgeGradle 2.3 requires Pack200 (removed in Java 14+), so use Java 8 for the daemon
org.gradle.java.home=/root/.local/share/mise/installs/java/temurin-8.0.482+8

# 代理配置 (sandbox requires proxy for outbound)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1
