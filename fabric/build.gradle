buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.10.5'
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'java'

version = '1.2.1'
group = 'com.hwbench'

def mcVersion = project.findProperty('mc.version') ?: '1.20.1'
def yarnVersion = project.findProperty('yarn.version') ?: '1.20.1+build.10'
def loaderVersion = project.findProperty('loader.version') ?: '0.15.11'
def fabricApiVersion = project.findProperty('fabric.api.version') ?: '0.92.0+1.20.1'

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings "net.fabricmc:yarn:${yarnVersion}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

    // Fabric API 0.77.0+1.19.2 移除了 v1 command API 的传递依赖，需要显式添加
    if (mcVersion == '1.19.2') {
        modImplementation "net.fabricmc.fabric-api:fabric-command-api-v1:${fabricApiVersion}"
    }

    implementation 'com.hwbench:HardwareBenchmark-common:1.2.1'
    include 'com.hwbench:HardwareBenchmark-common:1.2.1'

    implementation 'com.github.oshi:oshi-core:6.6.5'
    include 'com.github.oshi:oshi-core:6.6.5'
    implementation 'net.java.dev.jna:jna:5.15.0'
    include 'net.java.dev.jna:jna:5.15.0'
    implementation 'net.java.dev.jna:jna-platform:5.15.0'
    include 'net.java.dev.jna:jna-platform:5.15.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    include 'com.google.code.gson:gson:2.11.0'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    include 'org.slf4j:slf4j-api:2.0.16'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    inputs.property 'version', project.version
    // 1.16.5 的 Fabric API mod id 为 "fabric"，1.18+ 才改为 "fabric-api" 并 provides ["fabric"]
    def fabricApiId = mcVersion.startsWith('1.16') ? 'fabric' : 'fabric-api'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'fabricApiId': fabricApiId
    }
}
