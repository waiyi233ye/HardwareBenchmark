# HardwareBenchmark 测试用轻量配置（快速验证合并 JAR 可用性）
benchmark:
  cpu:
    donut-frames: 30
    compute-iterations: 2
    matrix-size: 128
    show-donut-animation: false
  memory:
    array-size-mb: 32
    iterations: 3
  disk:
    file-size-mb: 32
    block-size-kb: 64
    random-io-count: 100
server-control:
  kick-message: "&c[硬件跑分] 服务器正在进行硬件跑分测试，请稍后重新连接。"
  lock-message: "&c[硬件跑分] 服务器正在跑分中，暂时无法进入。"
  auto-unlock: true
  kick-delay: 1
library-manager:
  enabled: true
  package-manager: auto
  required-libraries:
    - "lshw"
    - "lm-sensors"
    - "pciutils"
    - "smartmontools"
  auto-install: true
report:
  save-to-file: true
  output-dir: "hwbench-reports"
  verbose-console: true
